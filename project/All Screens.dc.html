<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  p = (() => {
    const sel = ['brakes'], sym = { brakes: 'not-working' }, det = { brakes: 'unsure' };
    const when = { day: 2, half: 'AM', time: '10:30' };
    const ob = { bike: 'haul', acc: ['lock', 'helmet'], feat: ['thirdparty'] };
    return {
      i1: { step: 'area' },
      i2: { step: 'area', sel },
      i3: { step: 'symptom', hist: ['area'], sel },
      i4: { step: 'detail', hist: ['area', 'symptom'], sel, sym },
      i5: { step: 'schedule', hist: ['area', 'symptom', 'detail'], sel, sym, det, ...when },
      i6: { step: 'confirm', hist: ['area', 'symptom', 'detail', 'schedule'], sel, sym, det, ...when },
      i7: { step: 'booked', hist: ['area', 'symptom', 'detail', 'schedule', 'confirm'], sel, sym, det, ...when },
      o1: { step: 'welcome' },
      o2: { step: 'bike', hist: ['welcome'] },
      o3: { step: 'acc', hist: ['welcome', 'bike'], ...ob },
      o4: { step: 'feat', hist: ['welcome', 'bike', 'acc'], ...ob },
      o5: { step: 'confirm', hist: ['welcome', 'bike', 'acc', 'feat'], ...ob },
      o6: { step: 'cart', hist: ['welcome', 'bike', 'acc', 'feat', 'confirm'], ...ob },
      o7: { step: 'done', hist: ['welcome', 'bike', 'acc', 'feat', 'confirm', 'cart'], ...ob },
      r1: { view: 'tracker', mine: [] },
      r2: { view: 'choose', mine: [], pick: 'coffee' },
      r3: { view: 'added', mine: ['coffee'], last: 'coffee' },
      r4: { view: 'tracker', mine: ['coffee', 'sticker'] },
      r5: { view: 'single', mine: ['coffee', 'sticker'], open: 'coffee' }
    };
  })();
  renderVals() { return { p: this.p }; }
}
</script>
